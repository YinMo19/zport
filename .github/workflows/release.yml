name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            zig: true
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.zig

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "zport-${{ matrix.target }}.tar.gz" zport
          mv "zport-${{ matrix.target }}.tar.gz" "${{ github.workspace }}"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path zport.exe -DestinationPath "$env:GITHUB_WORKSPACE/zport-${{ matrix.target }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: zport-${{ matrix.target }}.${{ matrix.ext }}
